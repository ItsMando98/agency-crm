<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=960" />
    <script src="./gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 960px; overflow: hidden; background: #07070a; }
      #root { position: relative; width: 1280px; height: 960px; overflow: hidden; background: #07070a; }
      #scene { position: absolute; inset: 0; width: 1280px; height: 960px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="roaswell-expertise-google" data-start="0" data-duration="6" data-width="1280" data-height="960">
      <canvas id="scene" class="clip" width="1280" height="960" data-start="0" data-duration="6" data-track-index="0"></canvas>
    </div>
    <script>
      const W = 1280;
      const H = 960;
      const DURATION = 6;
      const TAU = Math.PI * 2;
      const RED = [255, 52, 72];
      const PAPER = [244, 241, 234];
      const canvas = document.getElementById("scene");
      const ctx = canvas.getContext("2d");

      const rgba = (c, a) => `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a})`;
      const clamp = (v, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, v));
      const lerp = (a, b, p) => a + (b - a) * p;
      const frac = (v) => v - Math.floor(v);
      const linear = (p) => p;
      const easeInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
      const easeIn = (p) => p * p * p;
      const easeOut = (p) => 1 - Math.pow(1 - p, 3);
      const seg = (t, a, b, ease = linear) => ease(clamp((t - a) / (b - a)));
      const pulse = (t, a, peak, b) => clamp(Math.min((t - a) / (peak - a), (b - t) / (b - peak)));
      const mix = (c1, c2, p) => [lerp(c1[0], c2[0], p), lerp(c1[1], c2[1], p), lerp(c1[2], c2[2], p)].map(Math.round);

      function mulberry32(seed) {
        let s = seed >>> 0;
        return function () {
          s = (s + 0x6d2b79f5) >>> 0;
          let v = Math.imul(s ^ (s >>> 15), 1 | s);
          v = (v + Math.imul(v ^ (v >>> 7), 61 | v)) ^ v;
          return ((v ^ (v >>> 14)) >>> 0) / 4294967296;
        };
      }

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function background(glowAlpha) {
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "#0a0a0d";
        ctx.fillRect(0, 0, W, H);
        const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
        g.addColorStop(0, rgba(RED, glowAlpha));
        g.addColorStop(1, rgba(RED, 0));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      }

      function vignette() {
        ctx.globalCompositeOperation = "source-over";
        const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.4, W / 2, H / 2, Math.max(W, H) * 0.75);
        v.addColorStop(0, "rgba(7, 7, 10, 0)");
        v.addColorStop(1, "rgba(7, 7, 10, 0.7)");
        ctx.fillStyle = v;
        ctx.fillRect(0, 0, W, H);
      }


      const rand = mulberry32(7);
      const DOTS = Array.from({ length: 54 }, (_, i) => ({
        base: (i / 54) * TAU + rand() * 0.4,
        cycles: 1 + (i % 2),
        phase: rand(),
        size: 2.4 + rand() * 2.2,
      }));

      function draw(t) {
        background(0.1);
        const cx = W / 2;
        const cy = H / 2;
        ctx.lineWidth = 1.5;
        for (const radius of [130, 260, 390]) {
          ctx.strokeStyle = "rgba(244, 241, 234, 0.13)";
          ctx.beginPath();
          ctx.arc(cx, cy, radius, 0, TAU);
          ctx.stroke();
        }
        ctx.strokeStyle = "rgba(244, 241, 234, 0.07)";
        ctx.beginPath();
        ctx.moveTo(cx, 60);
        ctx.lineTo(cx, H - 60);
        ctx.moveTo(60, cy);
        ctx.lineTo(W - 60, cy);
        ctx.stroke();

        ctx.globalCompositeOperation = "lighter";
        for (const dot of DOTS) {
          const p = frac(dot.cycles * (t / DURATION) + dot.phase);
          const radius = lerp(560, 26, easeIn(p));
          const angle = dot.base + p * 1.5;
          const x = cx + Math.cos(angle) * radius;
          const y = cy + Math.sin(angle) * radius;
          const fade = Math.pow(Math.sin(Math.PI * p), 0.6);
          const heat = seg(p, 0.55, 0.95);
          const color = mix(PAPER, RED, heat);
          const glow = ctx.createRadialGradient(x, y, 0, x, y, dot.size * 6);
          glow.addColorStop(0, rgba(color, 0.4 * fade));
          glow.addColorStop(1, rgba(color, 0));
          ctx.fillStyle = glow;
          ctx.fillRect(x - dot.size * 6, y - dot.size * 6, dot.size * 12, dot.size * 12);
          ctx.fillStyle = rgba(color, 0.95 * fade);
          ctx.beginPath();
          ctx.arc(x, y, dot.size * (1 - 0.35 * p), 0, TAU);
          ctx.fill();
        }

        const pulseP = frac(t / DURATION * 3);
        ctx.strokeStyle = rgba(RED, 0.55 * (1 - pulseP));
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(cx, cy, 30 + pulseP * 150, 0, TAU);
        ctx.stroke();

        const breathe = 1 + 0.12 * Math.sin(TAU * 3 * (t / DURATION));
        const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, 120);
        core.addColorStop(0, rgba(RED, 0.5));
        core.addColorStop(1, rgba(RED, 0));
        ctx.fillStyle = core;
        ctx.fillRect(cx - 120, cy - 120, 240, 240);
        ctx.fillStyle = rgba(RED, 1);
        ctx.beginPath();
        ctx.arc(cx, cy, 20 * breathe, 0, TAU);
        ctx.fill();
        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        ctx.beginPath();
        ctx.arc(cx, cy, 7, 0, TAU);
        ctx.fill();
        vignette();
      }


      const clock = { t: 0 };
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to(clock, { t: DURATION, duration: DURATION, ease: "none", onUpdate: () => draw(clock.t) }, 0);
      window.__timelines["roaswell-expertise-google"] = tl;
      draw(0);
      tl.seek(0);
    </script>
  </body>
</html>
