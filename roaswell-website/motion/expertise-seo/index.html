<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=960" />
    <script src="./gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 960px; overflow: hidden; background: #07070a; }
      #root { position: relative; width: 1280px; height: 960px; overflow: hidden; background: #07070a; }
      #scene { position: absolute; inset: 0; width: 1280px; height: 960px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="roaswell-expertise-seo" data-start="0" data-duration="6" data-width="1280" data-height="960">
      <canvas id="scene" class="clip" width="1280" height="960" data-start="0" data-duration="6" data-track-index="0"></canvas>
    </div>
    <script>
      const W = 1280;
      const H = 960;
      const DURATION = 6;
      const TAU = Math.PI * 2;
      const RED = [255, 52, 72];
      const PAPER = [244, 241, 234];
      const canvas = document.getElementById("scene");
      const ctx = canvas.getContext("2d");

      const rgba = (c, a) => `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a})`;
      const clamp = (v, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, v));
      const lerp = (a, b, p) => a + (b - a) * p;
      const frac = (v) => v - Math.floor(v);
      const linear = (p) => p;
      const easeInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
      const easeIn = (p) => p * p * p;
      const easeOut = (p) => 1 - Math.pow(1 - p, 3);
      const seg = (t, a, b, ease = linear) => ease(clamp((t - a) / (b - a)));
      const pulse = (t, a, peak, b) => clamp(Math.min((t - a) / (peak - a), (b - t) / (b - peak)));
      const mix = (c1, c2, p) => [lerp(c1[0], c2[0], p), lerp(c1[1], c2[1], p), lerp(c1[2], c2[2], p)].map(Math.round);

      function mulberry32(seed) {
        let s = seed >>> 0;
        return function () {
          s = (s + 0x6d2b79f5) >>> 0;
          let v = Math.imul(s ^ (s >>> 15), 1 | s);
          v = (v + Math.imul(v ^ (v >>> 7), 61 | v)) ^ v;
          return ((v ^ (v >>> 14)) >>> 0) / 4294967296;
        };
      }

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function background(glowAlpha) {
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "#0a0a0d";
        ctx.fillRect(0, 0, W, H);
        const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
        g.addColorStop(0, rgba(RED, glowAlpha));
        g.addColorStop(1, rgba(RED, 0));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      }

      function vignette() {
        ctx.globalCompositeOperation = "source-over";
        const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.4, W / 2, H / 2, Math.max(W, H) * 0.75);
        v.addColorStop(0, "rgba(7, 7, 10, 0)");
        v.addColorStop(1, "rgba(7, 7, 10, 0.7)");
        ctx.fillStyle = v;
        ctx.fillRect(0, 0, W, H);
      }


      const ROW_COUNT = 6;
      const ROW_X = 170;
      const ROW_W = 940;
      const ROW_H = 92;
      const ROW_TOP = 290;
      const ROW_STEP = 106;

      function rankAt(t) {
        if (t < 0.6) return 5;
        if (t < 2.7) return 5 - 5 * seg(t, 0.6, 2.7, easeInOut);
        if (t < 3.7) return 0;
        if (t < 5.5) return 5 * seg(t, 3.7, 5.5, easeInOut);
        return 5;
      }

      function drawRow(pos, active, glowAmount) {
        const y = ROW_TOP + pos * ROW_STEP;
        const accent = active ? RED : PAPER;
        ctx.save();
        if (active) {
          const cx = ROW_X + ROW_W / 2;
          const cy = y + ROW_H / 2;
          ctx.translate(cx, cy);
          ctx.scale(1.025, 1.025);
          ctx.translate(-cx, -cy);
          ctx.shadowColor = "rgba(0, 0, 0, 0.7)";
          ctx.shadowBlur = 36;
          roundRect(ROW_X, y, ROW_W, ROW_H, 20);
          ctx.fillStyle = "#0b0b0e";
          ctx.fill();
          ctx.shadowBlur = 0;
        }
        if (active) {
          ctx.globalCompositeOperation = "lighter";
          const g = ctx.createRadialGradient(ROW_X + ROW_W / 2, y + ROW_H / 2, 0, ROW_X + ROW_W / 2, y + ROW_H / 2, 620);
          g.addColorStop(0, rgba(RED, 0.2 * glowAmount));
          g.addColorStop(1, rgba(RED, 0));
          ctx.fillStyle = g;
          ctx.fillRect(0, y - 300, W, 700);
          ctx.globalCompositeOperation = "source-over";
        }
        roundRect(ROW_X, y, ROW_W, ROW_H, 20);
        ctx.fillStyle = active ? rgba(RED, 0.1) : "rgba(244, 241, 234, 0.035)";
        ctx.fill();
        ctx.lineWidth = active ? 2 : 1.5;
        ctx.strokeStyle = active ? rgba(RED, 0.95) : "rgba(244, 241, 234, 0.14)";
        ctx.stroke();
        ctx.fillStyle = rgba(accent, active ? 0.95 : 0.2);
        ctx.beginPath();
        ctx.arc(ROW_X + 46, y + ROW_H / 2, 15, 0, TAU);
        ctx.fill();
        roundRect(ROW_X + 92, y + 28, ROW_W * 0.5, 12, 6);
        ctx.fillStyle = rgba(accent, active ? 0.85 : 0.26);
        ctx.fill();
        roundRect(ROW_X + 92, y + 52, ROW_W * 0.32, 10, 5);
        ctx.fillStyle = rgba(accent, active ? 0.45 : 0.14);
        ctx.fill();
        ctx.restore();
      }

      function draw(t) {
        background(0.1);
        const rank = rankAt(t);
        roundRect(ROW_X, 110, ROW_W, 96, 48);
        ctx.fillStyle = "rgba(244, 241, 234, 0.04)";
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = "rgba(244, 241, 234, 0.3)";
        ctx.stroke();
        ctx.strokeStyle = "rgba(244, 241, 234, 0.55)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(ROW_X + 54, 156, 14, 0, TAU);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(ROW_X + 64, 166);
        ctx.lineTo(ROW_X + 76, 178);
        ctx.stroke();
        roundRect(ROW_X + 104, 150, 300, 12, 6);
        ctx.fillStyle = "rgba(244, 241, 234, 0.3)";
        ctx.fill();

        for (let dot = 0; dot < ROW_COUNT; dot += 1) {
          const near = clamp(1 - Math.abs(rank - dot));
          ctx.fillStyle = rgba(mix(PAPER, RED, near), 0.25 + 0.75 * near);
          ctx.beginPath();
          ctx.arc(ROW_X + ROW_W - 190 + dot * 26, 158, 4 + 4 * near, 0, TAU);
          ctx.fill();
        }

        for (let k = 0; k < ROW_COUNT - 1; k += 1) {
          const pos = k + easeInOut(clamp(k + 1 - rank, 0, 1));
          drawRow(pos, false, 0);
        }
        drawRow(rank, true, 0.6 + 0.4 * (1 - rank / 5));
        vignette();
      }


      const clock = { t: 0 };
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to(clock, { t: DURATION, duration: DURATION, ease: "none", onUpdate: () => draw(clock.t) }, 0);
      window.__timelines["roaswell-expertise-seo"] = tl;
      draw(0);
      tl.seek(0);
    </script>
  </body>
</html>
