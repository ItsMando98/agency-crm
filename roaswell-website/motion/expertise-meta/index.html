<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=960" />
    <script src="./gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 960px; overflow: hidden; background: #07070a; }
      #root { position: relative; width: 1280px; height: 960px; overflow: hidden; background: #07070a; }
      #scene { position: absolute; inset: 0; width: 1280px; height: 960px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="roaswell-expertise-meta" data-start="0" data-duration="6" data-width="1280" data-height="960">
      <canvas id="scene" class="clip" width="1280" height="960" data-start="0" data-duration="6" data-track-index="0"></canvas>
    </div>
    <script>
      const W = 1280;
      const H = 960;
      const DURATION = 6;
      const TAU = Math.PI * 2;
      const RED = [255, 52, 72];
      const PAPER = [244, 241, 234];
      const canvas = document.getElementById("scene");
      const ctx = canvas.getContext("2d");

      const rgba = (c, a) => `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a})`;
      const clamp = (v, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, v));
      const lerp = (a, b, p) => a + (b - a) * p;
      const frac = (v) => v - Math.floor(v);
      const linear = (p) => p;
      const easeInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
      const easeIn = (p) => p * p * p;
      const easeOut = (p) => 1 - Math.pow(1 - p, 3);
      const seg = (t, a, b, ease = linear) => ease(clamp((t - a) / (b - a)));
      const pulse = (t, a, peak, b) => clamp(Math.min((t - a) / (peak - a), (b - t) / (b - peak)));
      const mix = (c1, c2, p) => [lerp(c1[0], c2[0], p), lerp(c1[1], c2[1], p), lerp(c1[2], c2[2], p)].map(Math.round);

      function mulberry32(seed) {
        let s = seed >>> 0;
        return function () {
          s = (s + 0x6d2b79f5) >>> 0;
          let v = Math.imul(s ^ (s >>> 15), 1 | s);
          v = (v + Math.imul(v ^ (v >>> 7), 61 | v)) ^ v;
          return ((v ^ (v >>> 14)) >>> 0) / 4294967296;
        };
      }

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function background(glowAlpha) {
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "#0a0a0d";
        ctx.fillRect(0, 0, W, H);
        const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
        g.addColorStop(0, rgba(RED, glowAlpha));
        g.addColorStop(1, rgba(RED, 0));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      }

      function vignette() {
        ctx.globalCompositeOperation = "source-over";
        const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.4, W / 2, H / 2, Math.max(W, H) * 0.75);
        v.addColorStop(0, "rgba(7, 7, 10, 0)");
        v.addColorStop(1, "rgba(7, 7, 10, 0.7)");
        ctx.fillStyle = v;
        ctx.fillRect(0, 0, W, H);
      }


      const TILE_W = 330;
      const TILE_H = 250;
      const GAP = 30;
      const ORIGIN_X = (W - (3 * TILE_W + 2 * GAP)) / 2;
      const ORIGIN_Y = (H - (3 * TILE_H + 2 * GAP)) / 2;
      const WINNER = 4;

      function drawTile(index, t, select) {
        const col = index % 3;
        const row = Math.floor(index / 3);
        const cx = ORIGIN_X + col * (TILE_W + GAP) + TILE_W / 2;
        const cy = ORIGIN_Y + row * (TILE_H + GAP) + TILE_H / 2;
        const winner = index === WINNER;
        const scan = pulse(t, index * 0.22, index * 0.22 + 0.2, index * 0.22 + 0.5);
        const scale = winner ? 1 + 0.1 * select : 1 - 0.02 * select;
        const dim = winner ? 1 : 1 - 0.8 * select;
        const accent = winner ? mix(PAPER, RED, select) : PAPER;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scale, scale);
        ctx.globalAlpha = dim;
        if (winner && select > 0.01) {
          ctx.globalCompositeOperation = "lighter";
          const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 380);
          g.addColorStop(0, rgba(RED, 0.3 * select));
          g.addColorStop(1, rgba(RED, 0));
          ctx.fillStyle = g;
          ctx.fillRect(-420, -420, 840, 840);
          ctx.globalCompositeOperation = "source-over";
        }
        roundRect(-TILE_W / 2, -TILE_H / 2, TILE_W, TILE_H, 22);
        ctx.fillStyle = winner ? rgba(RED, 0.04 + 0.2 * select) : rgba(PAPER, 0.03 + 0.1 * scan);
        ctx.fill();
        ctx.lineWidth = winner ? 1.5 + 1.5 * select : 1.5;
        ctx.strokeStyle = rgba(accent, winner ? 0.2 + 0.8 * select : 0.16 + 0.5 * scan);
        ctx.stroke();
        roundRect(-TILE_W / 2 + 26, -TILE_H / 2 + 26, TILE_W - 52, 118, 14);
        ctx.fillStyle = rgba(accent, winner ? 0.1 + 0.55 * select : 0.07 + 0.1 * scan);
        ctx.fill();
        roundRect(-TILE_W / 2 + 26, TILE_H / 2 - 74, 170, 12, 6);
        ctx.fillStyle = rgba(accent, winner ? 0.3 + 0.6 * select : 0.2 + 0.2 * scan);
        ctx.fill();
        roundRect(-TILE_W / 2 + 26, TILE_H / 2 - 48, 110, 10, 5);
        ctx.fillStyle = rgba(accent, winner ? 0.2 + 0.4 * select : 0.12 + 0.1 * scan);
        ctx.fill();
        ctx.restore();
      }

      function draw(t) {
        background(0.08);
        const select = seg(t, 2.3, 3.4, easeInOut) - seg(t, 5.1, 5.9, easeInOut);
        for (let index = 0; index < 9; index += 1) {
          if (index !== WINNER) drawTile(index, t, select);
        }
        drawTile(WINNER, t, select);
        const ring = frac((t - 3.2) / 1.6);
        if (t > 3.2 && t < 4.8) {
          const cx = ORIGIN_X + TILE_W + GAP + TILE_W / 2;
          const cy = ORIGIN_Y + TILE_H + GAP + TILE_H / 2;
          ctx.strokeStyle = rgba(RED, 0.5 * (1 - ring));
          ctx.lineWidth = 2;
          roundRect(cx - TILE_W / 2 - ring * 70, cy - TILE_H / 2 - ring * 70, TILE_W + ring * 140, TILE_H + ring * 140, 22 + ring * 40);
          ctx.stroke();
        }
        vignette();
      }


      const clock = { t: 0 };
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to(clock, { t: DURATION, duration: DURATION, ease: "none", onUpdate: () => draw(clock.t) }, 0);
      window.__timelines["roaswell-expertise-meta"] = tl;
      draw(0);
      tl.seek(0);
    </script>
  </body>
</html>
