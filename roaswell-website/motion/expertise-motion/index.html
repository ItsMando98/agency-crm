<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=960" />
    <script src="./gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 960px; overflow: hidden; background: #07070a; }
      #root { position: relative; width: 1280px; height: 960px; overflow: hidden; background: #07070a; }
      #scene { position: absolute; inset: 0; width: 1280px; height: 960px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="roaswell-expertise-motion" data-start="0" data-duration="6" data-width="1280" data-height="960">
      <canvas id="scene" class="clip" width="1280" height="960" data-start="0" data-duration="6" data-track-index="0"></canvas>
    </div>
    <script>
      const W = 1280;
      const H = 960;
      const DURATION = 6;
      const TAU = Math.PI * 2;
      const RED = [255, 52, 72];
      const PAPER = [244, 241, 234];
      const canvas = document.getElementById("scene");
      const ctx = canvas.getContext("2d");

      const rgba = (c, a) => `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a})`;
      const clamp = (v, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, v));
      const lerp = (a, b, p) => a + (b - a) * p;
      const frac = (v) => v - Math.floor(v);
      const linear = (p) => p;
      const easeInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
      const easeIn = (p) => p * p * p;
      const easeOut = (p) => 1 - Math.pow(1 - p, 3);
      const seg = (t, a, b, ease = linear) => ease(clamp((t - a) / (b - a)));
      const pulse = (t, a, peak, b) => clamp(Math.min((t - a) / (peak - a), (b - t) / (b - peak)));
      const mix = (c1, c2, p) => [lerp(c1[0], c2[0], p), lerp(c1[1], c2[1], p), lerp(c1[2], c2[2], p)].map(Math.round);

      function mulberry32(seed) {
        let s = seed >>> 0;
        return function () {
          s = (s + 0x6d2b79f5) >>> 0;
          let v = Math.imul(s ^ (s >>> 15), 1 | s);
          v = (v + Math.imul(v ^ (v >>> 7), 61 | v)) ^ v;
          return ((v ^ (v >>> 14)) >>> 0) / 4294967296;
        };
      }

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function background(glowAlpha) {
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "#0a0a0d";
        ctx.fillRect(0, 0, W, H);
        const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
        g.addColorStop(0, rgba(RED, glowAlpha));
        g.addColorStop(1, rgba(RED, 0));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      }

      function vignette() {
        ctx.globalCompositeOperation = "source-over";
        const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.4, W / 2, H / 2, Math.max(W, H) * 0.75);
        v.addColorStop(0, "rgba(7, 7, 10, 0)");
        v.addColorStop(1, "rgba(7, 7, 10, 0.7)");
        ctx.fillStyle = v;
        ctx.fillRect(0, 0, W, H);
      }


      const GX0 = 170;
      const GX1 = 1110;
      const GY0 = 600;
      const GY1 = 170;
      const P1 = [0.16, 1];
      const P2 = [0.3, 1];

      function bez(s, a, b) {
        const k = 1 - s;
        return 3 * k * k * s * a + 3 * k * s * s * b + s * s * s;
      }

      const CURVE = Array.from({ length: 241 }, (_, i) => {
        const s = i / 240;
        return { x: bez(s, P1[0], P2[0]), y: bez(s, P1[1], P2[1]) };
      });

      function curveY(u) {
        const x = clamp(u);
        let lo = 0;
        let hi = CURVE.length - 1;
        while (hi - lo > 1) {
          const mid = (lo + hi) >> 1;
          if (CURVE[mid].x < x) lo = mid;
          else hi = mid;
        }
        const span = CURVE[hi].x - CURVE[lo].x || 1;
        return lerp(CURVE[lo].y, CURVE[hi].y, (x - CURVE[lo].x) / span);
      }

      function progressAt(t) {
        if (t < 0.5) return 0;
        if (t < 2.7) return seg(t, 0.5, 2.7);
        if (t < 3.3) return 1;
        if (t < 5.5) return 1 - seg(t, 3.3, 5.5);
        return 0;
      }

      const px = (u) => lerp(GX0, GX1, u);
      const py = (v) => lerp(GY0, GY1, v);

      function draw(t) {
        background(0.09);
        const u = progressAt(t);

        ctx.lineWidth = 1;
        ctx.strokeStyle = "rgba(244, 241, 234, 0.07)";
        for (let i = 0; i <= 4; i += 1) {
          ctx.beginPath();
          ctx.moveTo(px(i / 4), GY0);
          ctx.lineTo(px(i / 4), GY1);
          ctx.moveTo(GX0, py(i / 4));
          ctx.lineTo(GX1, py(i / 4));
          ctx.stroke();
        }
        ctx.strokeStyle = "rgba(244, 241, 234, 0.35)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(GX0, GY1 - 20);
        ctx.lineTo(GX0, GY0);
        ctx.lineTo(GX1 + 20, GY0);
        ctx.stroke();

        ctx.strokeStyle = "rgba(244, 241, 234, 0.12)";
        ctx.lineWidth = 1.5;
        ctx.setLineDash([6, 8]);
        ctx.beginPath();
        ctx.moveTo(px(0), py(0));
        ctx.lineTo(px(P1[0]), py(P1[1]));
        ctx.moveTo(px(1), py(1));
        ctx.lineTo(px(P2[0]), py(P2[1]));
        ctx.stroke();
        ctx.setLineDash([]);
        for (const handle of [P1, P2]) {
          ctx.fillStyle = "rgba(244, 241, 234, 0.35)";
          ctx.beginPath();
          ctx.arc(px(handle[0]), py(handle[1]), 7, 0, TAU);
          ctx.fill();
        }

        ctx.strokeStyle = "rgba(244, 241, 234, 0.38)";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        CURVE.forEach((point, i) => {
          if (i === 0) ctx.moveTo(px(point.x), py(point.y));
          else ctx.lineTo(px(point.x), py(point.y));
        });
        ctx.stroke();

        ctx.globalCompositeOperation = "lighter";
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = rgba(RED, 0.95);
        ctx.lineWidth = 6;
        ctx.shadowColor = rgba(RED, 0.9);
        ctx.shadowBlur = 18;
        ctx.beginPath();
        let started = false;
        for (const point of CURVE) {
          if (point.x > u) break;
          if (!started) {
            ctx.moveTo(px(point.x), py(point.y));
            started = true;
          } else {
            ctx.lineTo(px(point.x), py(point.y));
          }
        }
        if (started) ctx.lineTo(px(u), py(curveY(u)));
        ctx.stroke();
        ctx.shadowBlur = 0;

        const headX = px(u);
        const headY = py(curveY(u));
        const flare = ctx.createRadialGradient(headX, headY, 0, headX, headY, 60);
        flare.addColorStop(0, "rgba(255, 255, 255, 0.9)");
        flare.addColorStop(0.2, rgba(RED, 0.7));
        flare.addColorStop(1, rgba(RED, 0));
        ctx.fillStyle = flare;
        ctx.fillRect(headX - 60, headY - 60, 120, 120);

        ctx.globalCompositeOperation = "source-over";
        const TRACK_Y = 790;
        ctx.strokeStyle = "rgba(244, 241, 234, 0.25)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(GX0, TRACK_Y);
        ctx.lineTo(GX1, TRACK_Y);
        ctx.stroke();
        for (const end of [0, 1]) {
          ctx.save();
          ctx.translate(px(end), TRACK_Y);
          ctx.rotate(Math.PI / 4);
          ctx.strokeStyle = "rgba(244, 241, 234, 0.55)";
          ctx.lineWidth = 2;
          ctx.strokeRect(-9, -9, 18, 18);
          ctx.restore();
        }
        for (let k = 6; k >= 1; k -= 1) {
          const back = clamp(u + (progressAt(Math.max(0, t - 0.04 * k)) - u));
          const bx = px(curveY(back));
          ctx.fillStyle = rgba(RED, 0.09 * (7 - k));
          ctx.beginPath();
          ctx.arc(bx, TRACK_Y, 26, 0, TAU);
          ctx.fill();
        }
        const ballX = px(curveY(u));
        ctx.fillStyle = rgba(RED, 1);
        ctx.beginPath();
        ctx.arc(ballX, TRACK_Y, 26, 0, TAU);
        ctx.fill();
        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        ctx.beginPath();
        ctx.arc(ballX, TRACK_Y, 8, 0, TAU);
        ctx.fill();
        vignette();
      }


      const clock = { t: 0 };
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to(clock, { t: DURATION, duration: DURATION, ease: "none", onUpdate: () => draw(clock.t) }, 0);
      window.__timelines["roaswell-expertise-motion"] = tl;
      draw(0);
      tl.seek(0);
    </script>
  </body>
</html>
