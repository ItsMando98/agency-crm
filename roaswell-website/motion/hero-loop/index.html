<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2560, height=1440" />
    <script src="./gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 2560px; height: 1440px; overflow: hidden; background: #07070a; }
      #root { position: relative; width: 2560px; height: 1440px; overflow: hidden; background: #07070a; }
      #scene { position: absolute; inset: 0; width: 2560px; height: 1440px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="roaswell-hero-loop" data-start="0" data-duration="10" data-width="2560" data-height="1440">
      <canvas id="scene" class="clip" width="2560" height="1440" data-start="0" data-duration="10" data-track-index="0"></canvas>
    </div>
    <script>
      const W = 2560;
      const H = 1440;
      const DURATION = 10;
      const TAU = Math.PI * 2;
      const RED = [255, 52, 72];
      const PAPER = [244, 241, 234];
      const canvas = document.getElementById("scene");
      const ctx = canvas.getContext("2d");

      const rgba = (c, a) => `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a})`;
      const clamp = (v, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, v));
      const lerp = (a, b, p) => a + (b - a) * p;
      const frac = (v) => v - Math.floor(v);
      const linear = (p) => p;
      const easeInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
      const easeIn = (p) => p * p * p;
      const easeOut = (p) => 1 - Math.pow(1 - p, 3);
      const seg = (t, a, b, ease = linear) => ease(clamp((t - a) / (b - a)));
      const pulse = (t, a, peak, b) => clamp(Math.min((t - a) / (peak - a), (b - t) / (b - peak)));
      const mix = (c1, c2, p) => [lerp(c1[0], c2[0], p), lerp(c1[1], c2[1], p), lerp(c1[2], c2[2], p)].map(Math.round);

      function mulberry32(seed) {
        let s = seed >>> 0;
        return function () {
          s = (s + 0x6d2b79f5) >>> 0;
          let v = Math.imul(s ^ (s >>> 15), 1 | s);
          v = (v + Math.imul(v ^ (v >>> 7), 61 | v)) ^ v;
          return ((v ^ (v >>> 14)) >>> 0) / 4294967296;
        };
      }

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function background(glowAlpha) {
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "#0a0a0d";
        ctx.fillRect(0, 0, W, H);
        const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
        g.addColorStop(0, rgba(RED, glowAlpha));
        g.addColorStop(1, rgba(RED, 0));
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      }

      function vignette() {
        ctx.globalCompositeOperation = "source-over";
        const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.4, W / 2, H / 2, Math.max(W, H) * 0.75);
        v.addColorStop(0, "rgba(7, 7, 10, 0)");
        v.addColorStop(1, "rgba(7, 7, 10, 0.7)");
        ctx.fillStyle = v;
        ctx.fillRect(0, 0, W, H);
      }


      const LW = 1920;
      const LH = 1080;
      const K = W / LW;
      const SPACING = 52;
      const COLS = Math.ceil(LW / SPACING) + 1;
      const ROWS = Math.ceil(LH / SPACING) + 1;
      const GLOW_R = 400;

      const dither = document.createElement("canvas");
      dither.width = 256;
      dither.height = 256;
      (function () {
        const dctx = dither.getContext("2d");
        const rnd = mulberry32(99);
        const img = dctx.createImageData(256, 256);
        for (let i = 0; i < img.data.length; i += 4) {
          const v = rnd() > 0.5 ? 255 : 0;
          img.data[i] = v;
          img.data[i + 1] = v;
          img.data[i + 2] = v;
          img.data[i + 3] = 255;
        }
        dctx.putImageData(img, 0, 0);
      })();

      function draw(t) {
        const a = TAU * (t / DURATION);
        const lx = LW * (0.64 + 0.2 * Math.sin(a));
        const ly = LH * (0.5 + 0.18 * Math.sin(2 * a + 0.7));

        ctx.setTransform(K, 0, 0, K, 0, 0);
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "#07070a";
        ctx.fillRect(0, 0, LW, LH);

        ctx.globalCompositeOperation = "lighter";
        const glow = ctx.createRadialGradient(lx, ly, 0, lx, ly, 640);
        glow.addColorStop(0, rgba(RED, 0.2));
        glow.addColorStop(0.5, rgba(RED, 0.06));
        glow.addColorStop(1, rgba(RED, 0));
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, LW, LH);

        for (let gy = 0; gy < ROWS; gy += 1) {
          for (let gx = 0; gx < COLS; gx += 1) {
            const x = gx * SPACING;
            const y = gy * SPACING;
            const dx = x - lx;
            const dy = y - ly;
            const d = Math.sqrt(dx * dx + dy * dy);
            const f = Math.exp(-(d * d) / (2 * GLOW_R * GLOW_R));
            const wave = 0.5 + 0.5 * Math.sin(d * 0.016 - TAU * 2 * (t / DURATION));
            const push = f * wave * 9;
            const px = x + (dx / (d + 1)) * push;
            const py = y + (dy / (d + 1)) * push;
            const heat = Math.pow(f, 0.7);
            const color = mix(PAPER, RED, heat);
            const alpha = 0.1 + 0.62 * f * (0.45 + 0.55 * wave);
            const radius = 1.3 + 2.8 * f * wave;
            ctx.fillStyle = rgba(color, alpha);
            ctx.beginPath();
            ctx.arc(px, py, radius, 0, TAU);
            ctx.fill();
          }
        }

        ctx.globalCompositeOperation = "source-over";
        const left = ctx.createLinearGradient(0, 0, LW * 0.62, 0);
        left.addColorStop(0, "rgba(7, 7, 10, 0.82)");
        left.addColorStop(1, "rgba(7, 7, 10, 0)");
        ctx.fillStyle = left;
        ctx.fillRect(0, 0, LW, LH);
        const top = ctx.createLinearGradient(0, 0, 0, LH * 0.25);
        top.addColorStop(0, "rgba(7, 7, 10, 0.9)");
        top.addColorStop(1, "rgba(7, 7, 10, 0)");
        ctx.fillStyle = top;
        ctx.fillRect(0, 0, LW, LH * 0.25);
        const bottom = ctx.createLinearGradient(0, LH, 0, LH * 0.7);
        bottom.addColorStop(0, "rgba(7, 7, 10, 0.95)");
        bottom.addColorStop(1, "rgba(7, 7, 10, 0)");
        ctx.fillStyle = bottom;
        ctx.fillRect(0, LH * 0.7, LW, LH * 0.3);

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 0.05;
        ctx.globalCompositeOperation = "overlay";
        ctx.fillStyle = ctx.createPattern(dither, "repeat");
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
      }


      const clock = { t: 0 };
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to(clock, { t: DURATION, duration: DURATION, ease: "none", onUpdate: () => draw(clock.t) }, 0);
      window.__timelines["roaswell-hero-loop"] = tl;
      draw(0);
      tl.seek(0);
    </script>
  </body>
</html>
