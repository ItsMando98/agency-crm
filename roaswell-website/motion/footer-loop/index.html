<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=800" />
    <script src="./gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 800px;
        overflow: hidden;
        background: #07070a;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 800px;
        overflow: hidden;
        background: #07070a;
      }
      #scene {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 800px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="footer-loop"
      data-start="0"
      data-duration="8"
      data-width="1920"
      data-height="800"
    >
      <canvas
        id="scene"
        class="clip"
        width="1920"
        height="800"
        data-start="0"
        data-duration="8"
        data-track-index="0"
      ></canvas>
    </div>

    <script>
      const WIDTH = 1920;
      const HEIGHT = 800;
      const DURATION = 8;
      const TAU = Math.PI * 2;
      const RED = [255, 52, 72];
      const WINE = [96, 10, 24];

      const canvas = document.getElementById("scene");
      const ctx = canvas.getContext("2d");

      function mulberry32(seed) {
        let state = seed >>> 0;
        return function () {
          state = (state + 0x6d2b79f5) >>> 0;
          let value = Math.imul(state ^ (state >>> 15), 1 | state);
          value = (value + Math.imul(value ^ (value >>> 7), 61 | value)) ^ value;
          return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
        };
      }

      const rand = mulberry32(20260410);
      const rgba = (color, alpha) => `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${alpha})`;
      const frac = (value) => value - Math.floor(value);
      const smooth = (value) => value * value * (3 - 2 * value);

      const BAR_COUNT = 110;
      const bars = Array.from({ length: BAR_COUNT }, () => ({
        phase: rand(),
        cycles: rand() > 0.5 ? 2 : 1,
        jitter: 0.03 + rand() * 0.07,
      }));

      const PARTICLE_COUNT = 150;
      const particles = Array.from({ length: PARTICLE_COUNT }, () => ({
        x: rand() * WIDTH,
        phase: rand(),
        cycles: 1 + Math.floor(rand() * 3),
        sway: 8 + rand() * 38,
        swayPhase: rand(),
        size: 0.8 + rand() * 2.6,
        warm: rand() > 0.82,
      }));

      const glows = [
        { x: 0.78, y: 0.38, r: 760, phase: 0.0, alpha: 0.34 },
        { x: 0.22, y: 0.72, r: 620, phase: 0.33, alpha: 0.2 },
        { x: 0.55, y: 0.95, r: 900, phase: 0.66, alpha: 0.26 },
      ];

      function envelope(x, t) {
        const u = x / WIDTH;
        const ramp = 0.16 + 0.5 * Math.pow(u, 1.35);
        const swell = 0.8 + 0.2 * Math.sin(TAU * (t / DURATION + u * 2));
        return ramp * swell;
      }

      function drawBackground() {
        const gradient = ctx.createLinearGradient(0, 0, 0, HEIGHT);
        gradient.addColorStop(0, "#07070a");
        gradient.addColorStop(1, "#0d0508");
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
      }

      function drawGlows(t) {
        ctx.globalCompositeOperation = "lighter";
        for (const glow of glows) {
          const angle = TAU * (t / DURATION + glow.phase);
          const cx = glow.x * WIDTH + Math.sin(angle) * 140;
          const cy = glow.y * HEIGHT + Math.cos(angle) * 70;
          const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, glow.r);
          gradient.addColorStop(0, rgba(RED, glow.alpha));
          gradient.addColorStop(0.45, rgba(WINE, glow.alpha * 0.55));
          gradient.addColorStop(1, rgba(WINE, 0));
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, WIDTH, HEIGHT);
        }
      }

      function drawGrid(t) {
        ctx.globalCompositeOperation = "source-over";
        ctx.strokeStyle = "rgba(244, 241, 234, 0.045)";
        ctx.lineWidth = 1;
        const shift = frac(t / DURATION) * 96;
        for (let x = -96 + shift; x < WIDTH; x += 96) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, HEIGHT);
          ctx.stroke();
        }
        for (let y = 80; y < HEIGHT; y += 96) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(WIDTH, y);
          ctx.stroke();
        }
      }

      function drawBars(t) {
        const step = WIDTH / BAR_COUNT;
        const barWidth = step * 0.56;
        ctx.globalCompositeOperation = "lighter";
        for (let i = 0; i < BAR_COUNT; i += 1) {
          const bar = bars[i];
          const x = i * step + (step - barWidth) / 2;
          const wave = Math.sin(TAU * (bar.cycles * (t / DURATION) + bar.phase));
          const level = envelope(x + barWidth / 2, t) + bar.jitter * wave;
          const height = Math.max(8, level * HEIGHT * 0.64);
          const top = HEIGHT - height;
          const gradient = ctx.createLinearGradient(0, top, 0, HEIGHT);
          gradient.addColorStop(0, rgba(RED, 0.55));
          gradient.addColorStop(0.5, rgba(RED, 0.14));
          gradient.addColorStop(1, rgba(WINE, 0));
          ctx.fillStyle = gradient;
          ctx.fillRect(x, top, barWidth, height);
          ctx.fillStyle = rgba(RED, 0.85);
          ctx.fillRect(x, top, barWidth, 2);
        }
      }

      function drawSignal(t) {
        const head = frac(t / DURATION) * WIDTH;
        const points = [];
        for (let x = -20; x <= WIDTH + 20; x += 10) {
          const level = envelope(Math.min(Math.max(x, 0), WIDTH), t);
          points.push([x, HEIGHT - level * HEIGHT * 0.64 - 14]);
        }

        ctx.globalCompositeOperation = "lighter";
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        for (let i = 1; i < points.length; i += 1) {
          const [x0, y0] = points[i - 1];
          const [x1, y1] = points[i];
          const behind = (head - x1 + WIDTH) % WIDTH;
          const trail = Math.exp(-behind / 520);
          const intensity = 0.1 + 0.9 * trail;
          ctx.strokeStyle = `rgba(255, ${Math.round(70 + 150 * trail)}, ${Math.round(88 + 140 * trail)}, ${intensity})`;
          ctx.lineWidth = 2 + 3 * trail;
          ctx.shadowColor = rgba(RED, 0.9 * trail);
          ctx.shadowBlur = 26 * trail;
          ctx.beginPath();
          ctx.moveTo(x0, y0);
          ctx.lineTo(x1, y1);
          ctx.stroke();
        }
        ctx.shadowBlur = 0;

        const headLevel = envelope(head, t);
        const headY = HEIGHT - headLevel * HEIGHT * 0.64 - 14;
        const flare = ctx.createRadialGradient(head, headY, 0, head, headY, 90);
        flare.addColorStop(0, "rgba(255, 255, 255, 0.95)");
        flare.addColorStop(0.18, rgba(RED, 0.7));
        flare.addColorStop(1, rgba(RED, 0));
        ctx.fillStyle = flare;
        ctx.fillRect(head - 100, headY - 100, 200, 200);

        const pulse = frac(t / (DURATION / 4));
        ctx.strokeStyle = `rgba(255, 255, 255, ${0.6 * (1 - pulse)})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(head, headY, 8 + pulse * 46, 0, TAU);
        ctx.stroke();
      }

      function drawRings(t) {
        const cx = WIDTH * 0.84;
        const cy = HEIGHT * 1.12;
        ctx.globalCompositeOperation = "lighter";
        for (let i = 0; i < 4; i += 1) {
          const progress = frac(t / DURATION + i / 4);
          const radius = 60 + progress * 980;
          const alpha = Math.sin(progress * Math.PI) * 0.34;
          ctx.strokeStyle = rgba(RED, alpha);
          ctx.lineWidth = 1.5 + (1 - progress) * 2.5;
          ctx.beginPath();
          ctx.arc(cx, cy, radius, 0, TAU);
          ctx.stroke();
        }
      }

      function drawParticles(t) {
        ctx.globalCompositeOperation = "lighter";
        for (const particle of particles) {
          const progress = frac(particle.cycles * (t / DURATION) + particle.phase);
          const y = HEIGHT + 24 - progress * (HEIGHT + 48);
          const x = particle.x + Math.sin(TAU * (particle.cycles * (t / DURATION) + particle.swayPhase)) * particle.sway;
          const fade = Math.sin(progress * Math.PI);
          const color = particle.warm ? [255, 206, 190] : RED;
          const radius = particle.size * (0.7 + 0.5 * fade);
          const glow = ctx.createRadialGradient(x, y, 0, x, y, radius * 7);
          glow.addColorStop(0, rgba(color, 0.55 * fade));
          glow.addColorStop(1, rgba(color, 0));
          ctx.fillStyle = glow;
          ctx.fillRect(x - radius * 7, y - radius * 7, radius * 14, radius * 14);
          ctx.fillStyle = rgba(particle.warm ? [255, 240, 230] : [255, 190, 196], 0.9 * fade);
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, TAU);
          ctx.fill();
        }
      }

      function drawVignette() {
        ctx.globalCompositeOperation = "source-over";
        const edge = ctx.createRadialGradient(WIDTH / 2, HEIGHT / 2, HEIGHT * 0.35, WIDTH / 2, HEIGHT / 2, WIDTH * 0.62);
        edge.addColorStop(0, "rgba(7, 7, 10, 0)");
        edge.addColorStop(1, "rgba(7, 7, 10, 0.78)");
        ctx.fillStyle = edge;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        const top = ctx.createLinearGradient(0, 0, 0, HEIGHT * 0.45);
        top.addColorStop(0, "rgba(7, 7, 10, 0.95)");
        top.addColorStop(1, "rgba(7, 7, 10, 0)");
        ctx.fillStyle = top;
        ctx.fillRect(0, 0, WIDTH, HEIGHT * 0.45);
      }

      function draw(t) {
        drawBackground();
        drawGlows(t);
        drawGrid(t);
        drawRings(t);
        drawBars(t);
        drawSignal(t);
        drawParticles(t);
        drawVignette();
      }

      const clock = { t: 0 };
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to(
        clock,
        {
          t: DURATION,
          duration: DURATION,
          ease: "none",
          onUpdate: () => draw(clock.t),
        },
        0,
      );
      window.__timelines["footer-loop"] = tl;
      draw(0);
      tl.seek(0);
    </script>
  </body>
</html>
