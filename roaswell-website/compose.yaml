name: roaswell-website

services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
    image: roaswell-website:latest
    container_name: roaswell-website
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      TWENTY_API_URL: http://twenty-server:3000
      TWENTY_API_KEY: ${TWENTY_API_KEY:-}
      BOOKING_URL: ${BOOKING_URL:-}
      COMPANY_LEGAL_NAME: ${COMPANY_LEGAL_NAME:-}
      COMPANY_LEGAL_FORM: ${COMPANY_LEGAL_FORM:-}
      COMPANY_STREET: ${COMPANY_STREET:-}
      COMPANY_POSTAL_CODE: ${COMPANY_POSTAL_CODE:-}
      COMPANY_CITY: ${COMPANY_CITY:-}
      COMPANY_COUNTRY: ${COMPANY_COUNTRY:-}
      COMPANY_REPRESENTATIVE: ${COMPANY_REPRESENTATIVE:-}
      COMPANY_EMAIL: ${COMPANY_EMAIL:-}
      COMPANY_PHONE: ${COMPANY_PHONE:-}
      COMPANY_REGISTER_COURT: ${COMPANY_REGISTER_COURT:-}
      COMPANY_REGISTER_NUMBER: ${COMPANY_REGISTER_NUMBER:-}
      COMPANY_VAT_ID: ${COMPANY_VAT_ID:-}
      COMPANY_RESPONSIBLE_FOR_CONTENT: ${COMPANY_RESPONSIBLE_FOR_CONTENT:-}
      COMPANY_PRIVACY_EMAIL: ${COMPANY_PRIVACY_EMAIL:-}
      COMPANY_HOSTING_PROVIDER: ${COMPANY_HOSTING_PROVIDER:-}
      FOUNDER_NAME: ${FOUNDER_NAME:-}
      FOUNDER_ROLE: ${FOUNDER_ROLE:-}
      FOUNDER_LOCATION: ${FOUNDER_LOCATION:-}
      FOUNDER_PHOTO: ${FOUNDER_PHOTO:-}
      FOUNDER_BIO: ${FOUNDER_BIO:-}
      FOUNDER_LINKEDIN: ${FOUNDER_LINKEDIN:-}
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.middlewares.roaswell-website-redirect.redirectscheme.scheme: https
      traefik.http.middlewares.roaswell-website-redirect.redirectscheme.permanent: "true"
      traefik.http.routers.roaswell-website-http.rule: Host(`roaswell.com`) || Host(`www.roaswell.com`)
      traefik.http.routers.roaswell-website-http.entrypoints: http
      traefik.http.routers.roaswell-website-http.middlewares: roaswell-website-redirect
      traefik.http.routers.roaswell-website-https.rule: Host(`roaswell.com`) || Host(`www.roaswell.com`)
      traefik.http.routers.roaswell-website-https.entrypoints: https
      traefik.http.routers.roaswell-website-https.tls: "true"
      traefik.http.routers.roaswell-website-https.tls.certresolver: letsencrypt
      traefik.http.services.roaswell-website.loadbalancer.server.port: "3000"

networks:
  coolify:
    external: true
