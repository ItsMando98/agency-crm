name: roaswell-website

services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
    image: roaswell-website:latest
    container_name: roaswell-website
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      TWENTY_API_URL: http://twenty-server:3000
      TWENTY_API_KEY: ${TWENTY_API_KEY:-}
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.middlewares.roaswell-website-redirect.redirectscheme.scheme: https
      traefik.http.middlewares.roaswell-website-redirect.redirectscheme.permanent: "true"
      traefik.http.routers.roaswell-website-http.rule: Host(`roaswell.com`) || Host(`www.roaswell.com`)
      traefik.http.routers.roaswell-website-http.entrypoints: http
      traefik.http.routers.roaswell-website-http.middlewares: roaswell-website-redirect
      traefik.http.routers.roaswell-website-https.rule: Host(`roaswell.com`) || Host(`www.roaswell.com`)
      traefik.http.routers.roaswell-website-https.entrypoints: https
      traefik.http.routers.roaswell-website-https.tls: "true"
      traefik.http.routers.roaswell-website-https.tls.certresolver: letsencrypt
      traefik.http.services.roaswell-website.loadbalancer.server.port: "3000"

networks:
  coolify:
    external: true
